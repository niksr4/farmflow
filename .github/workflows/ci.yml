name: CI

on:
  push:
    # scanner/** matters as much as main here.
    #
    # This was `[main]` alone, and the QA scanner pushes to scanner/<date> branches and then tries
    # to open a PR. Its token lacks `Pull requests: write`, so the PR 403s -- which meant neither
    # trigger ever fired and NO scanner branch had been checked by CI, ever. Confirmed on
    # 2026-09-05: total_count 0 for every run keyed to those branches, across all history.
    #
    # Fixing the token would make `pull_request` fire, but this is the trigger that does not depend
    # on a credential someone has to remember to widen. Both now cover it.
    branches: [main, 'scanner/**']
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    # ⚠ PINNED, NOT `ubuntu-latest`. On 2026-10-19 the latest label rolled to Ubuntu 26.04 and
    # Playwright 1.58.2 cannot install chromium there: "ERROR: Playwright does not support
    # chromium on ubuntu26.04-x64". Both jobs died at the browser install step, which blocked
    # EVERY open pull request at once -- nine of them -- on a change in GitHub's image rather
    # than anything in this repo.
    #
    # `ubuntu-latest` means "whatever GitHub ships this week", which is a dependency nobody
    # declared and nobody can test before it lands. Pin it, and bump deliberately when
    # Playwright supports the next LTS.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXTAUTH_SECRET: ci-nextauth-secret
      DATABASE_URL: postgresql://ci:ci@localhost:5432/farmflow
      DATABASE_URL_DEV: postgresql://ci:ci@localhost:5432/farmflow
      CRON_SECRET: ci-cron-secret
      LOG_INGEST_TOKEN: ci-log-ingest-token
      NEXT_PUBLIC_POSTHOG_KEY: phc_ci_key
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      E2E_EXPECT_OWNER: "0"
      E2E_EXPECT_ADMIN: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history: the base check below needs a merge-base, and the default shallow clone
        # (fetch-depth 1) has no commits to find one in.
        with:
          fetch-depth: 0

      # Runs FIRST, before install, because everything after it is meaningless if the answer is
      # "this branch was cut from somewhere else". A scanner PR arrived on 2026-09-14 based on a
      # branch 16 commits behind main, and reported itself "verified fast-forward -- main hasn't
      # moved" while five merged PRs said otherwise. Green CI on that branch meant green against
      # the tree as it was before those five landed.
      # ⚠ PR_HEAD_SHA is load-bearing, not decoration. On a pull_request event the checkout above
      # is refs/pull/N/merge — a synthetic merge of the branch INTO the current base — so its HEAD
      # contains origin/main by construction and a merge-base check against HEAD passes for any
      # branch, however stale. That is not a theory: the first version of this gate printed
      # "✓ contains origin/main" for the sixteen-commits-behind branch it was written to reject.
      # The head sha is the real branch tip, and it is the merge commit's first parent, so
      # fetch-depth: 0 guarantees it is present.
      - name: Branch base
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/dev/check-branch-base.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version:` here on purpose. package.json's "packageManager": "pnpm@10.28.2" is the
        # single source of truth and action-setup reads it. Specifying both is now a hard error
        # ("Multiple versions of pnpm specified"), which killed every CI run from 2026-09-02 --
        # the day the packageManager pin was added -- until 2026-09-05. It failed at Setup pnpm in
        # under fifteen seconds, before lint, typecheck, tests or build had a chance to run, so
        # three days of pushes reported red for a reason that had nothing to do with the code.
        #
        # packageManager wins over a version here because it is exact (10.28.2, not 10) and it is
        # the field that also governs local installs -- which is the whole reason it exists: pnpm
        # 11 silently strips this repo's security overrides on install.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Neither `lint` nor `typecheck` above catches an unread import: eslint-config-next ships no
      # unused-vars rule and tsc says nothing without --noUnusedLocals. Turning this on found 78,
      # one of which had made a location-collision guard pass on the import line alone.
      - name: Dead imports
        run: pnpm lint:dead-imports

      - name: Unit tests + coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Public E2E
        run: pnpm test:e2e:public

  # Authenticated smoke tests exercise the LOGGED-IN app (dashboard tabs + labour form
  # persistence) — the surface the public E2E can't reach and where recent regressions hid.
  # Runs only when the E2E secrets are configured, so forks / secretless PRs skip it cleanly
  # instead of failing. Add these repo secrets to enable it:
  #   E2E_OWNER_USERNAME, E2E_OWNER_PASSWORD  (an owner account on the dev DB)
  #   DATABASE_URL_DEV                        (dev/test Neon connection the app runs against)
  #   NEXTAUTH_SECRET                         (matching the dev DB's sessions)
  authenticated-e2e:
    # ⚠ PINNED, NOT `ubuntu-latest`. On 2026-10-19 the latest label rolled to Ubuntu 26.04 and
    # Playwright 1.58.2 cannot install chromium there: "ERROR: Playwright does not support
    # chromium on ubuntu26.04-x64". Both jobs died at the browser install step, which blocked
    # EVERY open pull request at once -- nine of them -- on a change in GitHub's image rather
    # than anything in this repo.
    #
    # `ubuntu-latest` means "whatever GitHub ships this week", which is a dependency nobody
    # declared and nobody can test before it lands. Pin it, and bump deliberately when
    # Playwright supports the next LTS.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_OWNER_USERNAME: ${{ secrets.E2E_OWNER_USERNAME }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
      DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_POSTHOG_KEY: phc_ci_key
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version:` here on purpose. package.json's "packageManager": "pnpm@10.28.2" is the
        # single source of truth and action-setup reads it. Specifying both is now a hard error
        # ("Multiple versions of pnpm specified"), which killed every CI run from 2026-09-02 --
        # the day the packageManager pin was added -- until 2026-09-05. It failed at Setup pnpm in
        # under fifteen seconds, before lint, typecheck, tests or build had a chance to run, so
        # three days of pushes reported red for a reason that had nothing to do with the code.
        #
        # packageManager wins over a version here because it is exact (10.28.2, not 10) and it is
        # the field that also governs local installs -- which is the whole reason it exists: pnpm
        # 11 silently strips this repo's security overrides on install.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Tenant isolation is enforced by RLS policies in the database, not by application code,
      # so nothing in lint/typecheck/unit/build can observe it drifting. It did drift:
      # scripts/104 created transaction_history_archive (tenant_id, 38 rows of real ledger data
      # on prod) six migrations after script 98's discovery sweep had already run, so it shipped
      # to dev AND prod with no policy at all. schema:rls existed and would have caught it on day
      # one — it just was not wired into CI, so it only got run by hand on 2026-08-02, long after.
      #
      # Runs against the dev DB, which is the one CI has credentials for. Prod is deliberately not
      # reachable from CI; verify it with `pnpm schema:rls:prod` when applying migrations there.
      # ⚠ SAY SO WHEN THE GUARD IS NOT RUNNING. Measured on 2026-10-14: this job had been reporting
      # `success` with BOTH real steps `skipped`, because no repository secret was ever set --
      # `gh secret list` held only NEON_API_KEY. So the isolation guard described above, wired in
      # precisely because a table reached prod with no policy, had never once executed. A skipped
      # step and a passing step are indistinguishable on the checks list, which is the same
      # failure class as everything else this guard exists to catch: a green tick that means
      # nothing ran. This step cannot fail the build without blocking every PR until the secrets
      # are added, so it annotates loudly instead -- and the annotation is the thing to delete
      # once they are set, not this comment.
      - name: Warn if the isolation guard cannot run
        if: ${{ env.DATABASE_URL_DEV == '' }}
        run: |
          echo "::warning title=Tenant isolation guard did NOT run::DATABASE_URL_DEV is not set as a repository secret, so schema:rls and schema:isolation were skipped. RLS drift cannot be observed by any other check. Set DATABASE_URL_DEV to activate it."

      - name: Warn if the authenticated UI smoke cannot run
        if: ${{ env.E2E_OWNER_PASSWORD == '' || env.DATABASE_URL_DEV == '' }}
        run: |
          echo "::warning title=Authenticated E2E did NOT run::E2E_OWNER_USERNAME/E2E_OWNER_PASSWORD (and DATABASE_URL_DEV) are not set, so no signed-in screen is exercised anywhere in CI."

      - name: Tenant isolation guard (RLS coverage + cross-tenant read proof)
        if: ${{ env.DATABASE_URL_DEV != '' }}
        run: |
          pnpm schema:rls
          pnpm schema:isolation

      # These specs self-skip when creds are absent; the guard avoids even starting the dev
      # server (which needs a real DB) on secretless runs.
      - name: Authenticated E2E smoke (dashboard tabs + labour form persistence)
        if: ${{ env.E2E_OWNER_PASSWORD != '' && env.DATABASE_URL_DEV != '' }}
        run: pnpm exec playwright test tests/e2e/tab-smoke.spec.ts tests/e2e/form-persistence.spec.ts
