# CodeRabbit review configuration.
#
# Ported from greptile.json on 2026-09-23, which was deleted in the same commit. Greptile's trial
# credits ran out and it had stopped reviewing: every "review" it posted on PRs #32, #33 and #34
# was the same 50-credit-limit notice, one per push.
#
# THE RULES BELOW ARE NOT STYLE PREFERENCES. Each one is a production incident with a cost
# attached, written down so the next reader does not have to rediscover it. Treat this file as
# accumulated evidence rather than configuration, and add to it when something new bites.

language: en-US

# 250-char limit, so the substance lives in path_instructions below.
tone_instructions: >-
  Direct and specific. Flag a number that could be quietly wrong over a style concern. Say what
  breaks and under which input. Do not suggest removing long explanatory comments.

reviews:
  # Greptile ran at strictness 3 of 4. The characteristic defect here is silence, not noise, so
  # the dial is set high and the instructions below steer it away from nitpicking. Turn down to
  # "chill" if signal-to-noise degrades.
  profile: assertive

  path_filters:
    - "!pnpm-lock.yaml"
    - "!.next/**"
    - "!coverage/**"
    - "!playwright-report/**"
    - "!**/*.generated.*"

  path_instructions:
    - path: "**"
      instructions: >-
        This is a multi-tenant farm-management product used by five real coffee estates in Coorg,
        India. It handles wages paid to labourers, stock valuation and money owed. Its
        characteristic failure is NOT a crash: it is a confident wrong answer. Almost every serious
        defect found in this codebase returned a plausible number that was silently incorrect, and
        nothing threw. Review accordingly. Prefer flagging a figure that could be quietly wrong
        over a style concern. When a guard, filter or condition exists, ask what happens when it
        does not match rather than assuming it does. When two pieces of code express the same rule,
        check they still agree. A wrong number on a wage sheet is a worker underpaid, not a
        cosmetic issue.


        Long explanatory comments here are deliberate and load-bearing: most record a specific
        production incident, the figure it cost, and why the obvious alternative is wrong. Do not
        suggest removing or shortening them, and read them before flagging the code they sit above
        — the answer to many objections is already written there.


        Before ranking the severity of a finding, consider whether the feature has any data. Lot
        traceability, curing, quality, receivables, billing, compliance, documents, market-pricing
        and plant-health are built, shipped and used by nobody — zero rows across all tenants. An
        endpoint there returning nothing is almost always "no data exists" rather than "broken".


        Never write a literal NUL byte into a source file; use the escape \0. A raw NUL makes the
        whole file binary to grep, ripgrep, git diff and review tooling, so it silently disappears
        from every text search pointed at it. Roughly seventy tests here assert by reading source
        and matching strings.


        CLAUDE.md holds the architecture, module system, tenant isolation, migration and deployment
        rules plus the strategic decisions that must not be second-guessed. docs/RELEASE-FLOW.md
        holds how code reaches production and the gate in front of it.

    - path: "**/*.ts"
      instructions: >-
        MONEY TOTALS AND REVALUATION. Any SUM or aggregate of money over transaction_history must
        exclude revaluation rows, and there are TWO note spellings: 'Price correction%' AND 'Price
        updated%'. Correcting an item's price writes a deplete-and-restock pair at the entire
        holding; both rows carry money but nothing was bought or consumed. Excluding only one
        spelling produced Rs 105 crore of phantom depletion and Rs 64 crore of phantom purchases.
        Use EXCLUDE_REVALUATION_SQL from lib/revaluation-notes.ts rather than writing the filter
        inline. Row-level readers (ledger replay, reconciliation, exports) must NOT filter them out
        — only money totals.


        TENANT ISOLATION. Every query touching a table with a tenant_id column must go through
        runTenantQuery / runTenantQueries / runTenantTransaction. RLS is enforced by the
        app_runtime role, so a raw sql`` call outside that wrapper returns ZERO ROWS with no error
        rather than failing — a silent empty result that reads as "no data" rather than "broken".
        adminSql is the deliberate exception for DDL and self-healing.


        DATES OFF THE DRIVER. Postgres date and timestamp columns must be cast ::text in the
        SELECT. The Neon driver returns JS Date objects parsed at midnight UTC, so an un-cast date
        renders one day early in IST and every row shows "5:30 AM". The bug signature is
        String(date).slice(0, 10) applied to a Date rather than a string.


        THE ESTATE'S CLOCK. The business locale is IST; every server runs UTC. "Today" has one
        answer and lib/date-utils.ts owns it — todayIso() and istTodayParts(). Four shapes of this
        bug have shipped: new Date().toISOString().slice(0,10), the same via .split("T")[0],
        new Date().getMonth()/.getFullYear(), and the variable form (const now = new Date() on one
        line, now.getMonth() on another). Wall clocks belong in SQL via
        to_char(x AT TIME ZONE 'Asia/Kolkata', 'HH24:MI'); AT TIME ZONE alone yields a naive
        timestamp the driver re-offsets. A locale like "en-IN" picks the format, not the zone.


        PARTIAL UNIQUE INDEXES. An INSERT ... ON CONFLICT whose conflict target matches a PARTIAL
        unique index must repeat that index's WHERE predicate. Postgres cannot infer a partial
        index otherwise and the statement fails at PLAN time with 42P10, rolling back the whole
        surrounding transaction. current_inventory's unique indexes are partial on
        (location_id IS NULL) and (location_id IS NOT NULL); worker_pay_rules' are partial on
        (worker_id IS NULL / IS NOT NULL); rainfall_records' on (estate IS NULL / IS NOT NULL).
        This has reached production twice: it broke all expense editing for a tenant in August
        2026, and left the update_inventory() trigger unable to create a stock slot at all.


        BACKTICKS IN SQL TEMPLATES. Never write a backtick inside a SQL tagged template, not even
        in a comment. sql`...` is a template literal, so a stray backtick closes the string and the
        file stops compiling — or worse, changes what the query is. Referring to a column as
        `active` inside a query comment has broken this build three times in one day. Write column
        names bare in SQL comments.


        WHAT A GUARD MEASURES AGAINST. A guard must not be measured against data that the thing it
        guards against can move. A server-side price sanity check compared a new restock against
        current_inventory.avg_price — the exact value bad rows had already corrupted — so a
        poisoned average made correct data impossible to enter. Check what the guard's baseline is
        derived from.


        ONE RULE, ONE PLACE. When the same rule is expressed twice, flag it. Two SQL conditions in
        app/api/payroll-summary listed overlapping but different definitions of "this worker had
        activity this period"; the roster gate omitted ledger entries that the gate four lines
        below explicitly counted, so an inactive worker with a deduction vanished from the wage
        sheet while their money stayed recorded. Prefer one named definition used twice over two
        hand-written copies.

    - path: "app/api/**/route.ts"
      instructions: >-
        A route handler must never return a raw error.message, error.toString() or String(error)
        to the client. Postgres errors leak column names, constraint names and connection details.
        Route the message through sanitizeRouteError(error, fallback) or an equivalent helper.

    - path: "components/**"
      instructions: >-
        ABORT READS, NEVER MUTATIONS. AbortControllers are for READS only. Never abort a POST, PUT,
        PATCH or DELETE. Aborting a mutation does not roll back the server: the client reports
        failure for a write that committed, the user retries, and duplicate records follow.
        Mutations get single-flight and are allowed to finish.


        WHO IS READING THIS. Estates are the users: coffee and pepper growers in Coorg with a
        writer taking the muster on a phone. Error messages and labels should name the thing on the
        paperwork in front of them — an invoice total, a day's pay, a storehouse — not the system's
        internal model. Flag user-facing copy that describes a database concept.


        Never derive a wall clock or a calendar date in the browser. date-fns format(),
        toLocaleTimeString() and toLocaleDateString() all use the VIEWER's timezone unless given an
        explicit one. HoneyFarm's owner ran the app from Africa and every local-zone date read a
        day early for him.

    - path: "hooks/**"
      instructions: >-
        AbortControllers are for READS only — never abort a POST, PUT, PATCH or DELETE. Aborting a
        mutation does not roll back the server: the client reports failure for a write that
        committed, the user retries, and duplicate records follow.

    - path: "lib/pay-rules.ts"
      instructions: >-
        A scheduled deduction must be bounded by what is actually owed, not only by the schedule.
        Advance recovery computed instalments purely from amount, period count and start date,
        ignoring cash repayments — so an Rs 8,000 advance plus an Rs 3,000 repayment still
        collected four full instalments, taking Rs 11,000, while the displayed balance clamped at
        zero and hid it. Any Math.max(0, ...) on a balance can conceal over-recovery: check whether
        the excess is reported anywhere.

    - path: "lib/payroll-period.ts"
      instructions: >-
        A scheduled deduction must be bounded by what is actually owed, not only by the schedule.
        An Rs 8,000 advance plus an Rs 3,000 repayment once still collected four full instalments,
        taking Rs 11,000, while the displayed balance clamped at zero and hid it. Any
        Math.max(0, ...) on a balance can conceal over-recovery.

    - path: "app/api/payroll-summary/**"
      instructions: >-
        Recovery must be bounded by what is owed, not only by the schedule — an over-recovery here
        is money taken from a worker. Check that any Math.max(0, ...) on a balance is not hiding an
        excess, and that two conditions expressing "this worker had activity" agree exactly.

    - path: "app/api/worker-ledger/**"
      instructions: >-
        Recovery must be bounded by what is owed, not only by the schedule. Check that any
        Math.max(0, ...) on a balance is not concealing an over-recovery, and that the route's own
        summary is scoped to the same period the payroll run uses — these two screens have
        previously disagreed about what "total deductions" means.

    - path: "tests/**"
      instructions: >-
        A test must assert what the code SHOULD do, not what it currently does.
        tests/payroll-month-report.test.ts asserted an advance over-recovery as correct and
        explained it in a comment ("less four instalments, floored at zero"), which is Rs 11,000
        collected against Rs 8,000 lent written down as the expected answer. If a test's comment
        describes a surprising outcome as normal, question the outcome rather than accepting the
        comment.


        Most tests here assert by reading source text and matching strings, because the unit
        project runs in node with no DOM. Three ways that goes vacuous, all of which have happened:
        asserting a MENTION rather than a call (toContain("helperName") is satisfied by the import
        line); a hand-kept list of FILES, which is how the next instance hides; and a regex pinned
        to identifiers that happen to be in the current code rather than to the shape. A refactor
        that moves a string can break such a test without breaking behaviour, and these tests
        cannot see rendering bugs at all.


        A guard must be tamper-tested: break the thing it guards and watch it fail. A scan using
        \s inside git grep -E matched nothing at all — POSIX ERE has no \s — and passed against a
        deliberately broken tree.

    - path: "scripts/**"
      instructions: >-
        Migrations are sequential SQL in scripts/ and are applied manually to dev and prod
        separately. Sort migration numbers NUMERICALLY, never lexicographically — "100-x.sql" <
        "87-x.sql" as strings, and that bug once bootstrapped three-digit migrations as "already
        applied" without ever running them. Also note that schema_migrations recording a file as
        applied does not prove its effect survived: a recorded migration's function was later found
        absent from both databases, leaving a whole tab dead for seven months.


        An INSERT ... ON CONFLICT whose conflict target matches a PARTIAL unique index must repeat
        that index's WHERE predicate, or it fails at PLAN time with 42P10 and rolls back the
        surrounding transaction.
